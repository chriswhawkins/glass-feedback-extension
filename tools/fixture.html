<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Feedback — capture fixture</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
    section { height: 700px; padding: 60px 8vw; }
    .hero { color: white; background: linear-gradient(120deg, #6366f1, #2dd4bf); }
    .light { background: #f6f7f9; color: #15171c; }
    .dark { background: #0d1016; color: #e8eaf0; }
    h1 { font-size: 42px; }
  </style>
</head>
<body>
  <section class="hero"><h1>Glass Feedback</h1><p>A local capture fixture — no extension API stubs.</p></section>
  <section class="light"><h2>Light surface</h2><p>Add a note or drawing here, scroll, and capture the full page.</p></section>
  <section class="dark"><h2>Dark surface</h2><p>Check that this section appears at the end of the stitched image.</p></section>
</body>
</html>
